apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac-object.yaml
  - rbac-operator.yaml
  - rbac-cluster.yaml
  - operator.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: rook-ceph-operator-config
    namespace: rook-ceph
    literals:
      - ROOK_LOG_LEVEL=INFO
      - ROOK_OPERATOR_METRICS_BIND_ADDRESS=0
      - ROOK_CEPH_ALLOW_LOOP_DEVICES=false
      - ROOK_USE_CSI_OPERATOR=true
      - ROOK_OBC_WATCH_OPERATOR_NAMESPACE=true
      - ROOK_ENABLE_DISCOVERY_DAEMON=false
      - ROOK_CEPH_COMMANDS_TIMEOUT_SECONDS=15
      - ROOK_DISABLE_DEVICE_HOTPLUG=false
      - ROOK_DISCOVER_DEVICES_INTERVAL=60m
      - ROOK_ENFORCE_HOST_NETWORK=false
      - ROOK_CUSTOM_HOSTNAME_LABEL=
images:
  - name: docker.io/rook/ceph
    newTag: v1.21.0@sha256:2c3a65786d3cc85ba15d7f258461c0bf392c6a6ee19dde8011259b8d34eeedd0

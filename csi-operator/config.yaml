# CSI operator resources managed by the admin, replacing the CSI_* settings
# that used to live in operator/kustomization.yaml's rook-ceph-operator-config
# ConfigMap. As of Rook v1.20, that ConfigMap no longer configures CSI drivers;
# these CRs are the only thing ceph-csi-operator reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-csi-operator-image-set-configmap
  namespace: rook-ceph # namespace:operator
data:
  provisioner: "registry.k8s.io/sig-storage/csi-provisioner:v6.2.0"
  attacher: "registry.k8s.io/sig-storage/csi-attacher:v4.12.0"
  resizer: "registry.k8s.io/sig-storage/csi-resizer:v2.1.0"
  snapshotter: "registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0"
  registrar: "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0"
  plugin: "quay.io/cephcsi/cephcsi:v3.17.1"
  addons: "quay.io/csiaddons/k8s-sidecar:v0.14.0"
---
# Defaults for all CSI drivers. Field comments note the legacy ConfigMap
# literal each value replaces.
apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  name: ceph-csi-operator-config
  namespace: rook-ceph # namespace:operator
spec:
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    log:
      verbosity: 0
    enableMetadata: true
    generateOMapInfo: false
    fsGroupPolicy: File # was CSI_RBD_FSGROUPPOLICY / CSI_CEPHFS_FSGROUPPOLICY
    cephFsClientType: kernel # was CSI_FORCE_CEPHFS_KERNEL_CLIENT=true
    deployCsiAddons: false # was CSI_ENABLE_CSIADDONS=false
    attachRequired: true # was CSI_{CEPHFS,RBD}_ATTACH_REQUIRED=true
    grpcTimeout: 150 # was CSI_GRPC_TIMEOUT_SECONDS=150
    snapshotPolicy: volumeGroupSnapshot # was CSI_ENABLE_{CEPHFS,RBD}_SNAPSHOTTER=true + CSI_ENABLE_VOLUME_GROUP_SNAPSHOT=true
    controllerPlugin:
      replicas: 2 # was CSI_PROVISIONER_REPLICAS=2
      priorityClassName: system-cluster-critical # was CSI_PROVISIONER_PRIORITY_CLASSNAME
      deploymentStrategy:
        type: Recreate
    nodePlugin:
      priorityClassName: system-node-critical # was CSI_PLUGIN_PRIORITY_CLASSNAME
      kubeletDirPath: /var/lib/kubelet
      enableSeLinuxHostMount: false # was CSI_PLUGIN_ENABLE_SELINUX_HOST_MOUNT=false
---
# RBD CSI Driver. Its existence replaces ROOK_CSI_ENABLE_RBD=true.
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com # csi-provisioner-name
  namespace: rook-ceph # namespace:operator
spec:
  nodePlugin:
    updateStrategy:
      type: RollingUpdate
  controllerPlugin: {}
---
# CephFS CSI Driver. Its existence replaces ROOK_CSI_ENABLE_CEPHFS=true.
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.cephfs.csi.ceph.com # csi-provisioner-name
  namespace: rook-ceph # namespace:operator
spec:
  nodePlugin:
    updateStrategy:
      type: RollingUpdate
  controllerPlugin: {}
